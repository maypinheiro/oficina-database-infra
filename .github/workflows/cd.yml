name: Provision Database

on:
  workflow_run:
    workflows: ["Terraform CI"]
    types: [completed]
    branches: [homolog, main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [hml, prod]

permissions:
  contents: read

concurrency:
  group: oficina-database-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
      DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod' || 'hml') }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_private_subnet_ids: ${{ secrets.PRIVATE_SUBNET_IDS_JSON }}
      TF_VAR_allowed_security_group_ids: ${{ secrets.DATABASE_CALLER_SECURITY_GROUP_IDS_JSON }}
      TF_VAR_rds_ca_pem: ${{ secrets.RDS_CA_PEM }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.DEPLOY_REF }} # NOSONAR - only successful push runs from homolog/main reach this job
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.6.6
      - name: Plan and controlled apply
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=database/${{ env.DEPLOY_ENV }}/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE" -backend-config="encrypt=true"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          terraform output -json > deployment-outputs.json
      - name: Validate RDS availability and secret
        run: |
          DB_ID=$(terraform output -raw database_instance_identifier)
          SECRET_ARN=$(terraform output -raw database_secret_arn)
          aws rds wait db-instance-available --db-instance-identifier "$DB_ID"
          aws rds describe-db-instances --db-instance-identifier "$DB_ID" --query 'DBInstances[0].{Status:DBInstanceStatus,Public:PubliclyAccessible,Encrypted:StorageEncrypted}'
          aws secretsmanager describe-secret --secret-id "$SECRET_ARN" --query '{ARN:ARN,LastChangedDate:LastChangedDate}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-outputs-${{ env.DEPLOY_ENV }}-${{ env.DEPLOY_REF }}
          path: deployment-outputs.json
